name: ts-oracle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ts-oracle:
    name: ts-oracle (TypeScript resolveModuleName)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Compare JS/TS resolution with ts.resolveModuleName
        run: >-
          npx vitest run src/analyzer/ts-oracle.test.ts
          --reporter=default --reporter=json --outputFile.json=ts-oracle.json

      # Every fixture case must run, and each one must pass: one test per case, plus the case-list
      # check. A skipped or missing case must not pass this required check.
      - name: Fail if any fixture case did not run
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const r = JSON.parse(fs.readFileSync('ts-oracle.json', 'utf8'));
          const root = 'test/ts-oracle';
          const cases = fs.readdirSync(root).filter((n) => fs.statSync(path.join(root, n)).isDirectory()).length;
          const expected = cases + 1;
          if (r.numPassedTests !== expected || r.numPendingTests > 0 || r.numFailedTests > 0) {
            console.error('ts-oracle ran ' + r.numPassedTests + ' passed, ' + r.numPendingTests + ' skipped, ' + r.numFailedTests + ' failed; expected ' + expected + ' passed');
            process.exit(1);
          }
          console.log('all ' + expected + ' ts-oracle tests passed');
          "
