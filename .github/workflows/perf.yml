name: perf

# Non-blocking performance budget run. Not a required check until a few runs show stable numbers.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  perf:
    name: perf (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run perf budgets
        shell: bash
        env:
          BALK2_PERF: '1'
        run: |
          npx vitest run src/analyzer/js-perf.test.ts src/analyzer/rust/rust-perf.test.ts src/analyzer/python-perf.test.ts 2>&1 | tee perf-output.txt

      - name: Upload perf output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.os }}
          path: perf-output.txt
