name: perf

# Non-blocking performance budget run. Not a required check until a few runs show stable numbers.
# A run fails when a measured time is over the budget stored for its platform in test/perf-budgets.json.
# Runs on pull requests, pushes to main and on demand.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  perf:
    name: perf (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run perf budgets
        shell: bash
        env:
          BALK2_PERF: '1'
        run: |
          npx vitest run src/analyzer/js-perf.test.ts src/analyzer/rust/rust-perf.test.ts src/analyzer/python-perf.test.ts src/cli/generated-dirs.test.ts 2>&1 | tee perf-output.txt

      - name: Upload perf output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.os }}-node${{ matrix.node-version }}
          path: perf-output.txt
          if-no-files-found: warn
