name: rust-oracle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-oracle:
    name: rust-oracle (rustc stable, node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Show rustc version
        run: rustc --version

      - name: Install dependencies
        run: npm ci

      - name: Compare module files with rustc dependency files
        env:
          BALK2_RUST_ORACLE: '1'
        run: >-
          npx vitest run src/analyzer/rust/modules/rustc-oracle.test.ts
          --reporter=default --reporter=json --outputFile.json=rust-oracle.json

      # The oracle tests are skipped unless BALK2_RUST_ORACLE is set. A skip must not pass
      # this required check, so every oracle test has to pass: 3 workspace checks, the
      # modules-cfg check, 2 predicate tests, and 2 include and build-script checks.
      - name: Fail if any oracle test did not run
        run: |
          node -e "
          const r = JSON.parse(require('fs').readFileSync('rust-oracle.json', 'utf8'));
          const expected = 8;
          if (r.numPassedTests !== expected || r.numPendingTests > 0 || r.numFailedTests > 0) {
            console.error('oracle ran ' + r.numPassedTests + ' passed, ' + r.numPendingTests + ' skipped, ' + r.numFailedTests + ' failed; expected ' + expected + ' passed');
            process.exit(1);
          }
          console.log('all ' + expected + ' oracle tests passed');
          "
