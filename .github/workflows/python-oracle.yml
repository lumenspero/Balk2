name: python-oracle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-oracle:
    name: python-oracle (CPython 3.12, node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Use CPython 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Dump CPython inventory
        run: python3 test/python-oracle/dump_inventory.py test/python-oracle > "$RUNNER_TEMP/inventory.json"

      - name: Compare Balk2 with CPython
        env:
          BALK2_PY_ORACLE_INVENTORY: ${{ runner.temp }}/inventory.json
          BALK2_PY_ORACLE_ROOT: test/python-oracle
        run: npx vitest run src/analyzer/python/oracle.test.ts

      - name: Dump CPython import resolution
        run: python3 test/python-oracle/resolve_oracle.py test/python-resolution > "$RUNNER_TEMP/resolution.json"

      - name: Compare import resolution with importlib
        env:
          BALK2_PY_RESOLUTION_ORACLE: ${{ runner.temp }}/resolution.json
          BALK2_PY_RESOLUTION_ROOT: test/python-resolution
        run: npx vitest run src/analyzer/python/modules/resolution-oracle.test.ts
