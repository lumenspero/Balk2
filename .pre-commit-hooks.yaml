- id: balk2
  name: Balk2 connection map
  description: Regenerates connection-map.json and connection-map.md. When they change, the commit fails once; stage them and commit again. Needs Node 18+ and npm on the PATH.
  entry: scripts/balk2-hook.sh
  language: script
  pass_filenames: false
  always_run: true

- id: balk2-check
  name: Balk2 connection map is current
  description: Fails when connection-map.json is out of date with the repository. Changes no files. Needs Node 18+ and npm on the PATH.
  entry: scripts/balk2-hook.sh
  args: [check]
  language: script
  pass_filenames: false
  always_run: true
